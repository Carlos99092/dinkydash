# DinkyDash: calendario semanal
family_name: "Mi calendario"
timezone: "Europe/Madrid"
clock: "24h"
theme: light

# Añade uno o más enlaces iCal/ICS. Todos se combinan en la vista semanal.
calendars:
  - label: "Familia"
    url: "https://calendar.google.com/calendar/ical/you%40gmail.com/private-xxxx/basic.ics"
    enabled: true
    # shared_with: ["partner@example.com"]

calendar_days_ahead: 14
refresh_minutes: 60
data_file: "dashboard_data.json"
